name: Weekly slate

on:
  schedule:
    - cron: "0 19 * * 6"   # Saturday 3pm ET: pull Sunday lines + score (~65 credits)
    - cron: "0 15 * * 0"   # Sunday 11am ET: re-score with fresh injuries (no credits)
  workflow_dispatch:        # manual button in the GitHub app or site
    inputs:
      mode:
        description: "run = pull new lines + score (uses credits). score = re-score saved lines (free)."
        type: choice
        options: [score, run]
        default: score

permissions:
  contents: write

jobs:
  slate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 19 * * 6" ]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
          else
            echo "mode=score" >> "$GITHUB_OUTPUT"
          fi

      - name: Build slate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "run" ]; then
            python -m nflprops run --sunday
          else
            python -m nflprops --refresh score
          fi

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git diff --cached --quiet || git commit -m "Slate $(date -u +%F) (${{ steps.mode.outputs.mode }})"
          git push
